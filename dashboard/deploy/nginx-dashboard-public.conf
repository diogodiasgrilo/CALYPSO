# HYDRA Dashboard — public nginx reverse proxy for domytrade.com
# ================================================================
# 2026-07-31: real per-account login (bcrypt + TOTP 2FA) replaced the old
# shared DASHBOARD_API_KEY, so the dashboard can now be handed a real domain
# instead of the bare-IP self-signed-cert setup. This file is the HTTP-only
# starting point — certbot upgrades it in place to add the 443/TLS block and
# the 80->443 redirect, so don't hand-write `ssl_certificate` paths here.
#
# Deploy steps (run once, after domytrade.com's DNS A/AAAA records already
# point at this VM's static IP — verify with `dig domytrade.com` first):
#   1. sudo cp dashboard/deploy/nginx-dashboard-public.conf \
#        /etc/nginx/sites-available/dashboard-public
#   2. sudo ln -s /etc/nginx/sites-available/dashboard-public \
#        /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo apt install -y certbot python3-certbot-nginx   # if not already installed
#   5. sudo certbot --nginx -d domytrade.com -d www.domytrade.com --redirect
#      (obtains a real Let's Encrypt cert, rewrites THIS file in place to add
#      the 443 server block + ssl_certificate paths + an http->https redirect,
#      and installs its own systemd renewal timer)
#   6. systemctl list-timers certbot.timer   # confirm auto-renewal is active
#   7. Once confirmed working end to end, retire the old bare-IP self-signed
#      listener (see hydra_dashboard_external_access in the ops memory) so
#      there is one access path, not two.
#
# CRITICAL — X-Forwarded-For correctness (found in 2026-07-31 security
# review): the backend's login rate limiter (dashboard/backend/routers/auth.py
# :_client_ip) trusts X-Forwarded-For to identify the real visitor, since
# uvicorn only ever sees this nginx's loopback IP otherwise. This ONLY works
# if nginx OVERWRITES the header with $remote_addr (below) rather than using
# nginx's default $proxy_add_x_forwarded_for, which APPENDS to whatever the
# client already sent — an attacker could otherwise forge a fresh fake
# leading IP on every request and fully bypass the rate limiter. Do not
# "fix" the line below back to $proxy_add_x_forwarded_for.

server {
    listen 80;
    listen [::]:80;
    server_name domytrade.com www.domytrade.com;

    # Frontend static files
    root /opt/calypso/dashboard/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Baseline security headers (harmless even before certbot adds the HSTS
    # header to the eventual 443 block).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Static assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        # Overwrite, do NOT append (see the CRITICAL note above) — nginx is
        # the sole trusted entry point, so $remote_addr is authoritative.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;  # 24h for long-lived WS connections
        proxy_send_timeout 86400s;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
