# HYDRA Dashboard — nginx reverse proxy
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/
#
# audit M12: bound to LOCALHOST only. The dashboard exposes full bot state,
# P&L and config and had NO REST auth while a GCP firewall rule opened
# tcp:8080 to 0.0.0.0/0. Listening on 127.0.0.1 means it is unreachable
# from the public internet regardless of that firewall rule — reach it via
# an SSH tunnel:  gcloud compute ssh calypso-bot --zone=us-east1-b \
#   --project=calypso-trading-bot -- -L 8080:localhost:8080
# then browse http://localhost:8080 . App-layer API-key auth (require_api_key
# + calypso-dashboard-api-key in Secret Manager) is the second layer — see
# docs/migration/GATE2_DEPLOY_RUNBOOK.md.

server {
    listen 127.0.0.1:8080;
    server_name _;

    # Frontend static files
    root /opt/calypso/dashboard/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Static assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;  # 24h for long-lived WS connections
        proxy_send_timeout 86400s;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
